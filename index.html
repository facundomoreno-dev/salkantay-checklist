<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salkantay Pack • Perú</title>
  <style>
    :root {
      --bg: #08140f;
      --panel: #10231b;
      --panel2: #152d23;
      --cream: #f4ead7;
      --ink: #102019;
      --lime: #72d37f;
      --gold: #ffc95b;
      --blue: #65aef7;
      --muted: #9eb0a7;
      --line: #284238;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #07110d;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: var(--cream);
      font-size: 1.8rem;
      margin-bottom: 5px;
      text-align: center;
    }
    p.subtitle {
      color: var(--muted);
      text-align: center;
      margin-top: 0;
      font-size: 0.95rem;
    }
    .add-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"] {
      background: var(--panel2);
      border: 1px solid var(--line);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
    }
    .file-label {
      background: var(--panel2);
      border: 1px dashed var(--lime);
      color: var(--lime);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
    }
    input[type="file"] { display: none; }
    .btn {
      background: var(--lime);
      color: var(--ink);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-story {
      background: var(--gold);
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 1.1rem;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .item-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .item-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      background: var(--panel2);
    }
    .item-info {
      padding: 8px 10px;
      font-size: 0.85rem;
      color: var(--cream);
      font-weight: 500;
      text-align: center;
    }
    .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 0.7rem;
    }
    /* Story Preview Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .modal.active { display: flex; }
    canvas {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏔️ Salkantay Pack</h1>
    <p class="subtitle">Sube fotos de tu equipaje y genera tu IG Story organizada</p>

    <!-- Agregar Objeto -->
    <div class="add-box">
      <div class="input-group">
        <input type="text" id="itemName" placeholder="Ej: Botas de Trekking, Cámara, Carpa...">
        <label class="file-label" for="itemPhoto">📷 Adjuntar Foto del Objeto</label>
        <input type="file" id="itemPhoto" accept="image/*">
        <span id="fileName" style="font-size:0.8rem; color:var(--muted); text-align:center;"></span>
        <button class="btn" onclick="addItem()">+ Agregar a la lista</button>
      </div>
    </div>

    <!-- Galería de Objetos -->
    <div class="items-grid" id="itemsGrid"></div>

    <!-- Generar Story -->
    <button class="btn btn-story" onclick="openStoryModal()">📸 Generar Instagram Story</button>
  </div>

  <!-- Modal / Canvas Preview -->
  <div class="modal" id="storyModal">
    <canvas id="storyCanvas"></canvas>
    <div class="modal-actions">
      <button class="btn" onclick="downloadStory()">💾 Descargar Imagen</button>
      <button class="btn" style="background:#e05656; color:#fff;" onclick="closeStoryModal()">Cerrar</button>
    </div>
  </div>

  <script>
    let items = [];
    let currentPhotoData = null;

    // Detectar foto seleccionada
    document.getElementById('itemPhoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileName').innerText = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentPhotoData = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function addItem() {
      const nameInput = document.getElementById('itemName');
      const name = nameInput.value.trim();

      if (!name) {
        alert('Por favor escribe el nombre del objeto.');
        return;
      }

      items.push({
        name: name,
        image: currentPhotoData || null
      });

      // Reset
      nameInput.value = '';
      document.getElementById('itemPhoto').value = '';
      document.getElementById('fileName').innerText = '';
      currentPhotoData = null;

      renderItems();
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderItems();
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'item-card';
        
        const img = item.image ? `<img src="${item.image}" />` : `<div style="height:110px; background:var(--panel2); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:2rem;">🎒</div>`;

        card.innerHTML = `
          <button class="remove-btn" onclick="removeItem(${idx})">✕</button>
          ${img}
          <div class="item-info">${item.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    // --- GENERADOR DE INSTAGRAM STORY (Canvas 1080x1920) ---
    function openStoryModal() {
      if (items.length === 0) {
        alert('Agrega al menos un objeto antes de generar la Story.');
        return;
      }

      const modal = document.getElementById('storyModal');
      modal.classList.add('active');
      drawStoryCanvas();
    }

    function closeStoryModal() {
      document.getElementById('storyModal').classList.remove('active');
    }

    function drawStoryCanvas() {
      const canvas = document.getElementById('storyCanvas');
      const ctx = canvas.getContext('2d');

      // Calidad IG Story: 1080 x 1920
      canvas.width = 1080;
      canvas.height = 1920;

      // 1. Fondo Gradiente
      const grad = ctx.createLinearGradient(0, 0, 0, 1920);
      grad.addColorStop(0, '#07110d');
      grad.addColorStop(0.5, '#0e241b');
      grad.addColorStop(1, '#07110d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1920);

      // 2. Encabezado Estético
      ctx.fillStyle = '#ffc95b';
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SALKANTAY TREK • PERÚ', 540, 140);

      ctx.fillStyle = '#f4ead7';
      ctx.font = 'bold 64px sans-serif';
      ctx.fillText('MY PACKING LIST', 540, 220);

      ctx.fillStyle = '#72d37f';
      ctx.font = '30px sans-serif';
      ctx.fillText('Ready for the adventure ⛰️', 540, 270);

      // Línea divisora
      ctx.strokeStyle = '#284238';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(140, 310);
      ctx.lineTo(940, 310);
      ctx.stroke();

      // 3. Renderizar Cuadrícula de Objetos
      const cols = items.length > 6 ? 3 : 2; 
      const cardWidth = cols === 3 ? 260 : 380;
      const cardHeight = cols === 3 ? 320 : 420;
      const gapX = cols === 3 ? 35 : 50;
      const gapY = 40;

      const totalWidth = (cols * cardWidth) + ((cols - 1) * gapX);
      const startX = (1080 - totalWidth) / 2;
      const startY = 360;

      let loadedImages = 0;

      items.forEach((item, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);

        const x = startX + col * (cardWidth + gapX);
        const y = startY + row * (cardHeight + gapY);

        // Dibujar tarjeta (Polaroid Style)
        ctx.fillStyle = '#10231b';
        ctx.strokeStyle = '#284238';
        ctx.lineWidth = 2;
        
        // Esquinas redondeadas para tarjeta
        ctx.beginPath();
        ctx.roundRect(x, y, cardWidth, cardHeight, 16);
        ctx.fill();
        ctx.stroke();

        // Foto del ítem
        const imgHeight = cardHeight - 80;
        if (item.image) {
          const img = new Image();
          img.src = item.image;
          img.onload = () => {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x + 12, y + 12, cardWidth - 24, imgHeight, 10);
            ctx.clip();
            ctx.drawImage(img, x + 12, y + 12, cardWidth - 24, imgHeight);
            ctx.restore();

            // Texto debajo
            drawCardText(ctx, item.name, x, y + cardHeight - 30, cardWidth);
          };
        } else {
          // Placeholder sin foto
          ctx.fillStyle = '#152d23';
          ctx.beginPath();
          ctx.roundRect(x + 12, y + 12, cardWidth - 24, imgHeight, 10);
          ctx.fill();

          ctx.fillStyle = '#72d37f';
          ctx.font = '48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🎒', x + cardWidth / 2, y + imgHeight / 2 + 15);

          drawCardText(ctx, item.name, x, y + cardHeight - 30, cardWidth);
        }
      });

      // 4. Marca de agua / Footer
      ctx.fillStyle = '#9eb0a7';
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('📍 Cusco, Perú • Salkantay Pass 4,630m', 540, 1840);
    }

    function drawCardText(ctx, text, x, y, width) {
      ctx.fillStyle = '#f4ead7';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, x + width / 2, y, width - 20);
    }

    function downloadStory() {
      const canvas = document.getElementById('storyCanvas');
      const link = document.createElement('a');
      link.download = 'Salkantay-Pack-Story.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
