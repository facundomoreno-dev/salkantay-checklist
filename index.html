<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salkantay Pack • Perú</title>
  <style>
    :root {
      --bg: #08140f;
      --panel: #10231b;
      --panel2: #152d23;
      --cream: #f4ead7;
      --ink: #102019;
      --lime: #72d37f;
      --gold: #ffc95b;
      --blue: #65aef7;
      --muted: #9eb0a7;
      --line: #284238;
      --danger: #f76565;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #07110d;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      color: var(--cream);
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    header p {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--lime);
    }

    .file-btn {
      background: var(--panel2);
      border: 1px dashed var(--lime);
      color: var(--lime);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .file-btn:hover {
      background: var(--line);
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: var(--lime);
      color: var(--ink);
      font-weight: 600;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-gold {
      background: var(--gold);
      color: var(--ink);
    }

    /* Lista de objetos */
    .item-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--panel);
      border: 1px solid var(--line);
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      overflow: hidden;
    }

    .item-title {
      font-weight: 600;
      color: var(--cream);
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    /* Estilos para el Preview de Instagram Story */
    .story-container {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .story-card {
      width: 340px;
      height: 600px;
      background: linear-gradient(180deg, #0d2218 0%, #050d09 100%);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .story-header {
      text-align: center;
    }

    .story-header span {
      background: rgba(114, 211, 127, 0.15);
      color: var(--lime);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .story-header h2 {
      color: var(--cream);
      font-size: 1.4rem;
      margin: 10px 0 4px;
    }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px 0;
      flex: 1;
      align-content: start;
      overflow-y: auto;
    }

    .story-item {
      background: rgba(21, 45, 35, 0.8);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .story-item img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .story-item p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--cream);
      font-weight: 500;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .story-footer {
      text-align: center;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .story-footer p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎒 Mi Equipo - Salkantay Pack</h1>
    <p>Añade tus objetos y fotos para armar tu lista e Instagram Story</p>
  </header>

  <div class="panel">
    <div class="form-group">
      <input type="text" id="itemName" placeholder="Ej: Bolsa de dormir, Botas, Cámara..." />
      <label class="file-btn" for="itemPhoto">
        📷 <span id="fileNameLabel">Adjuntar foto</span>
      </label>
      <input type="file" id="itemPhoto" accept="image/*" onchange="updateFileName(this)" />
      <button class="btn" onclick="addItem()">Añadir Objeto</button>
    </div>

    <h3>Lista de Objetos (<span id="itemCount">0</span>)</h3>
    <div class="item-list" id="itemList">
      <!-- Los objetos agregados aparecerán aquí -->
    </div>
  </div>

  <div class="panel" style="text-align: center;">
    <h3>📸 Vista Previa para Instagram Story</h3>
    <p style="color: var(--muted); font-size: 0.9rem;">Así se verá tu Story organizada y lista para compartir:</p>

    <div class="story-container">
      <div class="story-card" id="storyCard">
        <div class="story-header">
          <span>Perú Trek 2026</span>
          <h2>SALKANTAY PACK</h2>
        </div>

        <div class="story-grid" id="storyGrid">
          <!-- Las fotos y nombres se renderizan aquí -->
        </div>

        <div class="story-footer">
          <p>⛰️ ¡Listo para la aventura!</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let items = [];

  function updateFileName(input) {
    const label = document.getElementById('fileNameLabel');
    if (input.files && input.files[0]) {
      label.innerText = input.files[0].name.length > 15 
        ? input.files[0].name.substring(0, 12) + '...' 
        : input.files[0].name;
    } else {
      label.innerText = 'Adjuntar foto';
    }
  }

  function addItem() {
    const nameInput = document.getElementById('itemName');
    const photoInput = document.getElementById('itemPhoto');
    const name = nameInput.value.trim();

    if (!name) {
      alert('Por favor, ingresa el nombre del objeto.');
      return;
    }

    const file = photoInput.files[0];

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveItem(name, e.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      // Imagen por defecto si no adjunta foto
      saveItem(name, 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%23284238"><rect width="100" height="100"/><text x="50%" y="50%" fill="%239eb0a7" dominant-baseline="middle" text-anchor="middle" font-size="14">Sin foto</text></svg>');
    }
  }

  function saveItem(name, imgUrl) {
    items.push({ id: Date.now(), name, imgUrl });
    document.getElementById('itemName').value = '';
    document.getElementById('itemPhoto').value = '';
    document.getElementById('fileNameLabel').innerText = 'Adjuntar foto';
    render();
  }

  function removeItem(id) {
    items = items.filter(item => item.id !== id);
    render();
  }

  function render() {
    const itemList = document.getElementById('itemList');
    const storyGrid = document.getElementById('storyGrid');
    const itemCount = document.getElementById('itemCount');

    itemCount.innerText = items.length;
    itemList.innerHTML = '';
    storyGrid.innerHTML = '';

    if (items.length === 0) {
      itemList.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1;">No has agregado objetos aún.</p>';
      storyGrid.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1; text-align:center; padding-top:40px;">Agrega objetos con fotos para ver tu story.</p>';
      return;
    }

    items.forEach(item => {
      // Card en panel principal
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <img src="${item.imgUrl}" class="item-thumb" alt="${item.name}">
        <div class="item-info">
          <div class="item-title">${item.name}</div>
          <div class="item-sub">Listo para llevar</div>
        </div>
        <button class="btn-del" onclick="removeItem(${item.id})">✕</button>
      `;
      itemList.appendChild(card);

      // Card en IG Story
      const storyItem = document.createElement('div');
      storyItem.className = 'story-item';
      storyItem.innerHTML = `
        <img src="${item.imgUrl}" alt="${item.name}">
        <p>${item.name}</p>
      `;
      storyGrid.appendChild(storyItem);
    });
  }

  // Inicializar
  render();
</script>

</body>
</html>
