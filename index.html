<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salkantay Pack • Perú</title>
  <style>
    :root {
      --cream: #f4f1ea;
      --lime: #84cc16;
      --gold: #eab308;
      --dark-bg: #12181b;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-light);
      line-height: 1.6;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      color: var(--lime);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 0;
    }

    /* --- SECCIÓN CREAR STORY --- */
    .story-creator-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 40px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .story-creator-section h2 {
      color: var(--gold);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--cream);
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text-light);
      font-size: 1rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
    }

    /* Botón personalizado para adjuntar foto */
    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: #0f172a;
      border: 2px dashed var(--lime);
      border-radius: 8px;
      cursor: pointer;
      color: var(--lime);
      font-weight: bold;
      transition: all 0.3s ease;
      text-align: center;
    }

    .file-input-label:hover {
      background: rgba(132, 204, 22, 0.1);
    }

    input[type="file"] {
      display: none;
    }

    .img-preview {
      margin-top: 15px;
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      object-fit: cover;
      display: none;
      border: 1px solid #475569;
    }

    .btn-submit {
      background: var(--lime);
      color: #0f172a;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%;
    }

    .btn-submit:hover {
      background: #a3e635;
      transform: translateY(-2px);
    }

    /* --- GALERÍA DE STORIES --- */
    .stories-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .story-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .story-card:hover {
      transform: translateY(-4px);
    }

    .story-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .story-card-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .story-card-author {
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .story-card-text {
      color: var(--cream);
      font-size: 0.95rem;
      flex-grow: 1;
    }

    .story-card-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Salkantay Pack • Perú</h1>
    <p>Explora la ruta y comparte tu experiencia en los Andes</p>
  </header>

  <div class="container">

    <!-- Sección: Crear Story -->
    <section class="story-creator-section">
      <h2>📸 Crear tu Story</h2>
      <form id="storyForm">
        <div class="form-group">
          <label for="authorName">Nombre o Usuario</label>
          <input type="text" id="authorName" placeholder="Ej. Camila Explorer" required>
        </div>

        <div class="form-group">
          <label>Adjuntar Foto de tu Experiencia</label>
          <div class="file-input-wrapper">
            <label for="storyPhoto" class="file-input-label" id="fileLabel">
              <span>📷 Seleccionar foto desde tu dispositivo</span>
            </label>
            <input type="file" id="storyPhoto" accept="image/*" required>
          </div>
          <img id="photoPreview" class="img-preview" alt="Vista previa de la imagen">
        </div>

        <div class="form-group">
          <label for="storyContent">Escribe tu Story</label>
          <textarea id="storyContent" placeholder="Cuenta tu experiencia, el paso por Humantay o la llegada a Salkantay..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Publicar Story</button>
      </form>
    </section>

    <!-- Sección: Historias Publicadas -->
    <section>
      <h2 style="color: var(--cream); margin-bottom: 20px;">📖 Stories de la Comunidad</h2>
      <div class="stories-gallery" id="storiesContainer">
        <!-- Las historias publicadas aparecerán aquí automáticamente -->
      </div>
    </section>

  </div>

  <script>
    const photoInput = document.getElementById('storyPhoto');
    const photoPreview = document.getElementById('photoPreview');
    const fileLabel = document.getElementById('fileLabel');
    const storyForm = document.getElementById('storyForm');
    const storiesContainer = document.getElementById('storiesContainer');

    let uploadedImageBase64 = '';

    // Vista previa inmediata de la foto adjunta
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImageBase64 = event.target.result;
          photoPreview.src = uploadedImageBase64;
          photoPreview.style.display = 'block';
          fileLabel.querySelector('span').innerText = `✓ Foto seleccionada: ${file.name}`;
        };
        reader.readAsDataURL(file);
      }
    });

    // Publicación dinámica de la Story
    storyForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const author = document.getElementById('authorName').value;
      const text = document.getElementById('storyContent').value;
      const dateStr = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });

      // Crear tarjeta HTML de la Story
      const storyCard = document.createElement('div');
      storyCard.className = 'story-card';
      storyCard.innerHTML = `
        <img src="${uploadedImageBase64}" alt="Story de ${author}">
        <div class="story-card-content">
          <div class="story-card-author">@${author}</div>
          <div class="story-card-text">${text}</div>
          <div class="story-card-date">${dateStr}</div>
        </div>
      `;

      // Agregar al inicio de la Galería
      storiesContainer.prepend(storyCard);

      // Limpiar formulario
      storyForm.reset();
      photoPreview.style.display = 'none';
      fileLabel.querySelector('span').innerText = '📷 Seleccionar foto desde tu dispositivo';
      uploadedImageBase64 = '';
    });
  </script>

</body>
</html>
